<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>출판기 계산기 → 출판 제안서 자동 복사(에폭시 조건 포함)</title>
  <style>
    :root { --gap:14px; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:#f6f7f9; }
    header { padding:16px 20px; background:#111827; color:#fff; }
    .wrap { padding:20px; }
    .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:var(--gap); align-items:start; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow: 0 2px 10px rgba(0,0,0,.04); overflow:hidden; }
    .card h2 { margin:0; padding:14px 16px; font-size:16px; border-bottom:1px solid #e5e7eb; background:#f9fafb; }
    .form { padding:14px 16px; }
    .row { display:grid; grid-template-columns: 140px 1fr; gap:10px; padding:6px 0; }
    label { color:#374151; font-size:13px; }
    input, select, textarea {
      width:100%; box-sizing:border-box;
      border:1px solid #d1d5db; border-radius:10px;
      padding:9px 10px; font-size:14px; background:#fff;
    }
    textarea { min-height:70px; resize:vertical; }
    .muted { color:#6b7280; font-size:12px; margin-top:8px; line-height:1.45; }
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; margin-left:8px; }
    .two { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .hr { height:1px; background:#e5e7eb; margin:12px 0; }
    .rightTop { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .btn {
      border:1px solid #d1d5db; background:#fff; border-radius:10px;
      padding:8px 10px; cursor:pointer; font-size:13px;
    }
    .btn:active { transform: translateY(1px); }
    .note { font-size:12px; color:#6b7280; }
    .readonly input, .readonly textarea { background:#fffbe6; }
  </style>
</head>
<body>
<header>
  <strong>출판기 계산기</strong> → <strong>출판 제안서</strong> 자동 메모(실시간 복사)
</header>

<div class="wrap">
  <div class="grid">
    <!-- LEFT: 제안서 -->
    <section class="card readonly">
      <h2>출판 제안서 <span class="badge">자동 입력</span></h2>
      <div class="form">
        <div class="row">
          <label>제목</label>
          <input id="p_title" placeholder="(필요 시 수동 입력)" />
        </div>

        <div class="row">
          <label>비용</label>
          <input id="p_cost" placeholder="예: 200만 원" />
        </div>

        <div class="row">
          <label>출판사명</label>
          <input id="p_publisher" value="북랩" />
        </div>

        <div class="row">
          <label>판형</label>
          <input id="p_size" placeholder="예: 신국판" />
        </div>

        <div class="row">
          <label>사양</label>
          <textarea id="p_spec" placeholder="예: 흑백 1도 200쪽 / 표지 4도 / 무선제본"></textarea>
        </div>

        <div class="row">
          <label>표지</label>
          <input id="p_cover" placeholder="예: 아트지 230g / 4도 / 무광코팅 (에폭시)" />
        </div>

        <div class="row">
          <label>제본</label>
          <input id="p_binding" placeholder="예: 무선제본" />
        </div>

        <div class="row">
          <label>중철본</label>
          <input id="p_saddle" placeholder="예: 40부" />
        </div>

        <div class="muted">
          오른쪽 ‘출판비용 셀프 계산기’에서 입력하면, 이 제안서 칸이 실시간으로 채워집니다.<br/>
          <b>에폭시가 “예”</b>이면 제안서 ‘표지’ 입력란 끝에 <b>(에폭시)</b>가 자동으로 붙습니다.
        </div>
      </div>
    </section>

    <!-- RIGHT: 계산기 -->
    <section class="card">
      <h2 class="rightTop">
        <span>출판비용 셀프 계산기</span>
        <button class="btn" type="button" id="btn_reset">초기화</button>
      </h2>
      <div class="form">
        <div class="row">
          <label>기준 패키지</label>
          <select id="c_package">
            <option value="고재 출판(46배판 이상)">고재 출판(46배판 이상)</option>
            <option value="일반 단행본">일반 단행본</option>
            <option value="에세이/수필">에세이/수필</option>
          </select>
        </div>

        <div class="row">
          <label>기준 페이지 수</label>
          <input id="c_base_pages" type="number" value="200" min="1" />
        </div>

        <div class="row">
          <label>총 페이지 수</label>
          <input id="c_total_pages" type="number" value="300" min="1" />
        </div>

        <div class="row">
          <label>컬러 페이지 수</label>
          <input id="c_color_pages" type="number" value="0" min="0" />
        </div>

        <div class="hr"></div>

        <div class="row">
          <label>표지 재질/사양</label>
          <input id="c_cover_base" value="아트지 230g/컬러 4도/무광코팅" />
        </div>

        <div class="row">
          <label>표지 에폭시</label>
          <select id="c_epoxy">
            <option value="아니오" selected>아니오</option>
            <option value="예">예</option>
          </select>
        </div>

        <div class="row">
          <label>제본</label>
          <select id="c_binding">
            <option value="무선제본" selected>무선제본</option>
            <option value="양장제본">양장제본</option>
            <option value="중철제본">중철제본</option>
          </select>
        </div>

        <div class="row">
          <label>중철본(기본 40부)</label>
          <input id="c_saddle" type="number" value="40" min="0" />
        </div>

        <div class="hr"></div>

        <div class="row">
          <label>총 예상 비용</label>
          <input id="c_est_cost" value="3,440,000원" />
        </div>

        <div class="note">
          * “총 예상 비용”은 예시값입니다. 실제 계산 로직이 있다면 JS에서 산출하도록 교체하면 됩니다.
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  // ====== 요소 가져오기 ======
  const el = (id) => document.getElementById(id);

  // 제안서(LEFT)
  const p_cost    = el("p_cost");
  const p_cover   = el("p_cover");
  const p_binding = el("p_binding");
  const p_saddle  = el("p_saddle");
  const p_spec    = el("p_spec");

  // 계산기(RIGHT)
  const c_package     = el("c_package");
  const c_base_pages  = el("c_base_pages");
  const c_total_pages = el("c_total_pages");
  const c_color_pages = el("c_color_pages");
  const c_cover_base  = el("c_cover_base");
  const c_epoxy       = el("c_epoxy");
  const c_binding     = el("c_binding");
  const c_saddle      = el("c_saddle");
  const c_est_cost    = el("c_est_cost");

  // ====== 핵심: 에폭시 조건 포함하여 표지 문자열 만들기 ======
  function buildCoverText() {
    const base = (c_cover_base.value || "").trim();
    const epoxyYes = (c_epoxy.value === "예");
    if (!base) return epoxyYes ? "(에폭시)" : "";
    return epoxyYes ? `${base} (에폭시)` : base;
  }

  // ====== 제안서 사양 텍스트(원하시면 형식 더 다듬을 수 있음) ======
  function buildSpecText() {
    const pkg = c_package.value;
    const basePages = Number(c_base_pages.value || 0);
    const totalPages = Number(c_total_pages.value || 0);
    const colorPages = Number(c_color_pages.value || 0);
    const bwPages = Math.max(totalPages - colorPages, 0);

    // 예: "고재 출판(46배판 이상) / 흑백 1도 300쪽(컬러 0쪽) / 기준 200쪽"
    const lines = [
      `${pkg}`,
      `총 ${totalPages}쪽 (흑백 ${bwPages}쪽 / 컬러 ${colorPages}쪽)`,
      `기준 페이지: ${basePages}쪽`,
      `표지: ${buildCoverText()}`,
      `제본: ${c_binding.value}`
    ];
    return lines.join(" / ");
  }

  // ====== 동기화(실시간 복사) ======
  function syncToProposal() {
    // 비용
    p_cost.value = (c_est_cost.value || "").trim();

    // 표지(에폭시 조건 처리)
    p_cover.value = buildCoverText();

    // 제본, 중철본
    p_binding.value = c_binding.value;
    p_saddle.value = (c_saddle.value || "").trim() ? `${c_saddle.value}부` : "";

    // 사양(원하시면 특정 필드로 더 세분화 가능)
    p_spec.value = buildSpecText();
  }

  // ====== 이벤트 연결 ======
  [
    c_package, c_base_pages, c_total_pages, c_color_pages,
    c_cover_base, c_epoxy, c_binding, c_saddle, c_est_cost
  ].forEach(ctrl => {
    ctrl.addEventListener("input", syncToProposal);
    ctrl.addEventListener("change", syncToProposal);
  });

  // 초기화 버튼
  el("btn_reset").addEventListener("click", () => {
    c_package.value = "고재 출판(46배판 이상)";
    c_base_pages.value = 200;
    c_total_pages.value = 300;
    c_color_pages.value = 0;
    c_cover_base.value = "아트지 230g/컬러 4도/무광코팅";
    c_epoxy.value = "아니오";
    c_binding.value = "무선제본";
    c_saddle.value = 40;
    c_est_cost.value = "3,440,000원";
    syncToProposal();
  });

  // 최초 1회 반영
  syncToProposal();
</script>
</body>
</html>
