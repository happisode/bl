<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>적요 TOP N + 검색</title>
<style>
  body{
    font-family: system-ui,-apple-system,BlinkMacSystemFont,
                 "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    padding:24px
  }
  .field{max-width:560px;position:relative}
  label{display:block;margin-bottom:6px;font-weight:600}
  input{
    width:100%;
    padding:10px 12px;
    border:1px solid #cfcfcf;
    border-radius:8px;
    font-size:14px;
  }
  .dropdown{
    position:absolute;left:0;right:0;top:100%;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    max-height:220px;
    overflow:auto;
    display:none;
    z-index:100;
  }
  .item{
    padding:9px 12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    gap:8px;
  }
  .item:hover,.item.active{background:#f5f5f5}
  .count{font-size:12px;color:#888}
  .hint{
    font-size:12px;
    color:#666;
    margin-top:6px;
    line-height:1.4;
  }
</style>
</head>
<body>

<h3>적요 입력 (최다 사용 TOP N)</h3>

<div class="field">
  <label for="summary">적요</label>
  <input id="summary" placeholder="클릭하면 TOP N / 입력하면 검색" autocomplete="off">
  <div id="dropdown" class="dropdown"></div>
  <div class="hint">
    · 클릭 → TOP N 표시<br>
    · 입력 → 즉시 필터<br>
    · Enter → 선택 확정 / Esc → 닫기
  </div>
</div>

<script>
  // 🔹 서버에서 내려주는 "최다 사용 적요 TOP N"
  const TOP_N = [
    { text: "chatGPT 구독료", count: 128 },
    { text: "네이버 키워드광고", count: 93 },
    { text: "사무 비품", count: 72 },
    { text: "프린터 토너 주문", count: 51 },
    { text: "직원 오찬", count: 44 },
    { text: "주유대", count: 41 },
    { text: "AI 제미나이 구독료", count: 39 },
    { text: "셔터스톡 구독료", count: 28 },
    { text: "택배비", count: 25 },
    { text: "도서/문구 구입", count: 22 }
  ];

  const input = document.getElementById("summary");
  const dropdown = document.getElementById("dropdown");

  let filtered = [...TOP_N];
  let active = -1;

  function open(){ dropdown.style.display = "block"; }
  function close(){ dropdown.style.display = "none"; active = -1; render(); }

  function render(){
    if (dropdown.style.display !== "block") return;

    if (!filtered.length){
      dropdown.innerHTML =
        `<div class="item" style="color:#888;cursor:default">
          일치하는 적요 없음 — 그대로 입력해도 됩니다
        </div>`;
      return;
    }

    dropdown.innerHTML = filtered.map((v,i)=>`
      <div class="item ${i===active?"active":""}" data-i="${i}">
        <span>${v.text}</span>
        <span class="count">${v.count}회</span>
      </div>
    `).join("");

    [...dropdown.children].forEach(el=>{
      const i = Number(el.dataset.i);
      if (isNaN(i)) return;
      el.addEventListener("mousedown",e=>{
        e.preventDefault(); // blur 방지
        pick(i);
      });
    });
  }

  function filter(q){
    const s = q.trim().toLowerCase();
    filtered = s
      ? TOP_N.filter(v=>v.text.toLowerCase().includes(s))
      : [...TOP_N];
    active = filtered.length ? 0 : -1;
    render();
  }

  function pick(i){
    if (!filtered[i]) return;
    input.value = filtered[i].text;
    close();
  }

  // 이벤트
  input.addEventListener("focus", ()=>{
    filter(input.value);
    open();
  });

  input.addEventListener("input", ()=>{
    open();
    filter(input.value);
  });

  input.addEventListener("keydown",e=>{
    if (dropdown.style.display !== "block") return;

    if (e.key === "Escape"){ close(); }
    if (e.key === "ArrowDown"){
      active = Math.min(active+1, filtered.length-1);
      render(); e.preventDefault();
    }
    if (e.key === "ArrowUp"){
      active = Math.max(active-1, 0);
      render(); e.preventDefault();
    }
    if (e.key === "Enter"){
      if (active >= 0) pick(active);
      else close();
      e.preventDefault();
    }
  });

  document.addEventListener("mousedown",e=>{
    if (!e.target.closest(".field")) close();
  });
</script>

</body>
</html>
