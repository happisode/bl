<!DOCTYPE html>
<html>
<head>
<style>
  /* 기본 테이블 스타일 */
  .quick-input-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Pretendard', sans-serif;
  }

  .quick-input-table th, .quick-input-table td {
    border-bottom: 1px solid #eee;
    padding: 12px;
    text-align: left;
  }

  /* 더보기 메뉴 컨테이너 */
  .menu-container {
    position: relative;
    display: inline-block;
    float: right;
  }

  /* 점 세 개 아이콘 버튼 */
  .more-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #888;
    padding: 0 8px;
    border-radius: 4px;
  }

  .more-btn:hover {
    background-color: #f0f0f0;
  }

  /* 드롭다운 메뉴 (기본 숨김) */
  .dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    background-color: white;
    min-width: 100px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
    border: 1px solid #ddd;
    border-radius: 4px;
    z-index: 10;
  }

  /* 메뉴 항목 스타일 */
  .dropdown-menu a {
    color: #333;
    padding: 10px 14px;
    text-decoration: none;
    display: block;
    font-size: 14px;
  }

  .dropdown-menu a:hover {
    background-color: #f5f5f5;
  }

  .dropdown-menu a.delete {
    color: #d9534f;
  }

  /* 클릭 시 메뉴 표시 (실제 구현 시 JS 필요, 여기선 hover로 예시) */
  .menu-container:hover .dropdown-menu {
    display: block;
  }
</style>
</head>
<body>

<h3>빠른 입력 관리 (개선안: 더보기 메뉴 통합)</h3>
<table class="quick-input-table">
  <thead>
    <tr>
      <th>내용 (클릭 시 입력)</th>
      <th style="width: 50px;"></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>점심 식대 (야근용)</td>
      <td>
        <div class="menu-container">
          <button class="more-btn">⋮</button>
          <div class="dropdown-menu">
            <a href="#">보기</a>
            <a href="#">수정</a>
            <a href="#" class="delete">삭제</a>
          </div>
        </div>
      </td>
    </tr>
    <tr>
      <td>법인 택시비 (미팅)</td>
      <td>
        <div class="menu-container">
          <button class="more-btn">⋮</button>
          <div class="dropdown-menu">
            <a href="#">보기</a>
            <a href="#">수정</a>
            <a href="#" class="delete">삭제</a>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>

</body>
</html>


</body>
