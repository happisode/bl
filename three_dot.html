<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빠른 입력 관리 팝업 실행</title>
</head>
<body>

    <button onclick="openQuickInputPopup()" style="padding: 10px 20px; cursor: pointer;">
        빠른 입력 관리 창 열기
    </button>

    <script>
        function openQuickInputPopup() {
            // 팝업에 들어갈 HTML 내용을 변수에 담습니다.
            const htmlContent = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body { margin: 0; padding: 20px; font-family: sans-serif; background: #fff; }
                    .quick-input-table { width: 100%; border-collapse: collapse; }
                    .quick-input-table th, .quick-input-table td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
                    .menu-container { position: relative; display: inline-block; float: right; }
                    .more-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; padding: 0 8px; border-radius: 4px; }
                    .more-btn:hover { background-color: #f0f0f0; }
                    .dropdown-menu { display: none; position: absolute; right: 0; top: 100%; background-color: white; min-width: 100px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); border: 1px solid #ddd; border-radius: 4px; z-index: 10; }
                    .dropdown-menu a { color: #333; padding: 10px 14px; text-decoration: none; display: block; font-size: 14px; }
                    .dropdown-menu a:hover { background-color: #f5f5f5; }
                    .dropdown-menu a.delete { color: #d9534f; }
                    .menu-container:hover .dropdown-menu { display: block; }
                    h3 { margin-top: 0; color: #333; border-bottom: 2px solid #333; padding-bottom: 10px; }
                </style>
            </head>
            <body>
                <h3>빠른 입력 관리 (개선안)</h3>
                <table class="quick-input-table">
                    <thead>
                        <tr>
                            <th>내용 (클릭 시 입력)</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>점심 식대 (야근용)</td>
                            <td>
                                <div class="menu-container">
                                    <button class="more-btn">⋮</button>
                                    <div class="dropdown-menu">
                                        <a href="#">보기</a>
                                        <a href="#">수정</a>
                                        <a href="#" class="delete">삭제</a>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>법인 택시비 (미팅)</td>
                            <td>
                                <div class="menu-container">
                                    <button class="more-btn">⋮</button>
                                    <div class="dropdown-menu">
                                        <a href="#">보기</a>
                                        <a href="#">수정</a>
                                        <a href="#" class="delete">삭제</a>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </body>
            </html>`;

            // HTML 내용을 Blob 객체로 변환하여 URL 생성 (가장 확실한 팝업 로드 방법)
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            // 가로 643, 세로 602 규격의 팝업창 생성
            window.open(url, "QuickInputPopup", "width=643,height=602,scrollbars=yes,resizable=yes");
        }
    </script>
</body>
</html>


</body>
